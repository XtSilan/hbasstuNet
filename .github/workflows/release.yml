name: Release Windows build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Verify source
        shell: pwsh
        run: |
          go test ./...
          go vet ./...
          npm run build --prefix frontend

      - name: Build Windows executable
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            throw "Tag must use the v1.2.3 format: $version"
          }
          wails build -clean -ldflags "-X main.appVersion=$version"

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $asset = "release/hbasstuNet-$env:RELEASE_VERSION-windows-amd64.exe"
          Copy-Item build/bin/hbasstuNet.exe $asset
          (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $asset -Leaf) | Set-Content "release/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: hbasstuNet ${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: release/*

      - name: Clean build output
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build/bin, release -ErrorAction SilentlyContinue
